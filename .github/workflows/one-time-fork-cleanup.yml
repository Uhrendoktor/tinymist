name: One-time fork documentation and branch cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-fork-cleanup.yml

permissions:
  contents: write

jobs:
  refresh-and-cleanup:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Ensure pinned local build tools
        run: bash scripts/ensure-wasm-tools.sh
      - name: Install JavaScript dependencies
        run: yarn install --frozen-lockfile --prefer-offline
      - name: Build the documentation renderer
        run: yarn build:typlite
      - name: Regenerate generated documentation
        run: node scripts/link-docs.mjs
      - name: Verify and commit the generated README
        run: |
          git add README.md
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "docs: regenerate README with fork ownership"
            git push origin HEAD:main
          fi
      - name: Delete merged feature branches
        run: |
          git push origin --delete \
            wasm/full-browser-tinymist \
            wasm/cargo-assets-manifest
          remaining="$(git ls-remote --heads origin \
            refs/heads/wasm/full-browser-tinymist \
            refs/heads/wasm/cargo-assets-manifest)"
          if [ -n "$remaining" ]; then
            echo "$remaining"
            echo "An obsolete WASM feature branch still exists." >&2
            exit 1
          fi
