name: WASM custom browser package

on:
  workflow_dispatch:
    inputs:
      manifest_path:
        description: Repository-relative JSON asset manifest
        required: true
        default: wasm-assets-smoke.json
        type: string
      update_lock:
        description: Download assets and generate/update the lockfile
        required: true
        default: true
        type: boolean

# Manual asset builds are independent from regular CI and replace older
# manual builds on the same ref rather than running concurrently.
concurrency:
  group: tinymist-browser-v2-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Fetch, embed, and package browser-only Tinymist
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 120
    steps:
      - name: Verify or provision host C compiler
        run: |
          set -euo pipefail
          if command -v cc >/dev/null 2>&1; then
            cc --version
            exit 0
          fi

          compiler=""
          if command -v gcc >/dev/null 2>&1; then
            compiler="$(command -v gcc)"
          elif command -v clang >/dev/null 2>&1; then
            compiler="$(command -v clang)"
          fi

          if [ -n "$compiler" ]; then
            mkdir -p "$RUNNER_TEMP/cc-bin"
            ln -sf "$compiler" "$RUNNER_TEMP/cc-bin/cc"
            echo "$RUNNER_TEMP/cc-bin" >> "$GITHUB_PATH"
            export PATH="$RUNNER_TEMP/cc-bin:$PATH"
          elif command -v apt-get >/dev/null 2>&1 && [ "$(id -u)" -eq 0 ]; then
            apt-get update
            apt-get install -y --no-install-recommends build-essential
          elif command -v sudo >/dev/null 2>&1 && command -v apt-get >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends build-essential
          else
            echo "::error::This self-hosted runner has no cc, gcc, or clang and no root/sudo access to install build-essential. Install a host C compiler on the runner."
            exit 1
          fi

          cc --version
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-unknown-unknown
          cache: false
      - name: Verify repository-pinned Rust toolchain
        run: |
          rustc --version
          cargo --version
          rustup target list --installed | grep -Fx wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install pinned Yarn without global runner changes
        run: |
          npm install --prefix "$RUNNER_TEMP/yarn" yarn@1.22.22
          export PATH="$RUNNER_TEMP/yarn/node_modules/.bin:$PATH"
          echo "$RUNNER_TEMP/yarn/node_modules/.bin" >> "$GITHUB_PATH"
          node --version
          npm --version
          yarn --version
      - name: Install pinned wasm-pack binary if needed
        run: |
          set -euo pipefail
          if ! command -v wasm-pack >/dev/null 2>&1; then
            archive="$RUNNER_TEMP/wasm-pack-v0.15.1-x86_64-unknown-linux-musl.tar.gz"
            install_dir="$RUNNER_TEMP/wasm-pack"
            binary_dir="$RUNNER_TEMP/wasm-pack-bin"
            mkdir -p "$install_dir" "$binary_dir"
            curl --fail --location --silent --show-error \
              "https://github.com/wasm-bindgen/wasm-pack/releases/download/v0.15.1/wasm-pack-v0.15.1-x86_64-unknown-linux-musl.tar.gz" \
              --output "$archive"
            echo "410101009739b9d01c7d5affaaad6e9c9a24b4cba6791a4805db8e89b9bf7af2  $archive" | sha256sum --check --status
            tar -xzf "$archive" -C "$install_dir"
            binary="$(find "$install_dir" -type f -name wasm-pack -print -quit)"
            test -n "$binary"
            install -m 0755 "$binary" "$binary_dir/wasm-pack"
            echo "$binary_dir" >> "$GITHUB_PATH"
            export PATH="$binary_dir:$PATH"
          fi
          wasm-pack --version
      - name: Install JavaScript dependencies
        run: yarn install --frozen-lockfile
      - name: Build browser-only VSIX with selected assets
        run: yarn package:vscode:web
        env:
          TINYMIST_WASM_ASSET_MANIFEST: ${{ inputs.manifest_path }}
          TINYMIST_WASM_ASSET_UPDATE_LOCK: ${{ inputs.update_lock }}
      - name: Upload browser VSIX, asset lock, and notices
        uses: actions/upload-artifact@v4
        with:
          name: tinymist-web-custom-${{ github.run_number }}
          path: |
            dist/tinymist-web-*.vsix
            target/wasm-assets/wasm-assets.lock.json
            target/wasm-assets/THIRD-PARTY-NOTICES.txt
          if-no-files-found: error
          retention-days: 14
