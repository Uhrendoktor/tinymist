name: WASM custom browser package

on:
  workflow_dispatch:
    inputs:
      manifest_path:
        description: Repository-relative JSON asset manifest
        required: true
        default: wasm-assets-smoke.json
        type: string
      update_lock:
        description: Download assets and generate/update the lockfile
        required: true
        default: true
        type: boolean

# Manual asset builds are independent from regular CI and replace older
# manual builds on the same ref rather than running concurrently.
concurrency:
  group: tinymist-browser-v2-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Fetch, embed, and package browser-only Tinymist
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    steps:
      - name: Verify or provision host build and archive tools
        run: |
          set -euo pipefail

          packages=()
          if ! command -v cc >/dev/null 2>&1 && ! command -v gcc >/dev/null 2>&1 && ! command -v clang >/dev/null 2>&1; then
            packages+=(build-essential)
          fi
          if ! command -v unzip >/dev/null 2>&1; then
            packages+=(unzip)
          fi

          if [ "${#packages[@]}" -gt 0 ]; then
            if command -v apt-get >/dev/null 2>&1 && [ "$(id -u)" -eq 0 ]; then
              apt-get update
              apt-get install -y --no-install-recommends "${packages[@]}"
            elif command -v sudo >/dev/null 2>&1 && command -v apt-get >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y --no-install-recommends "${packages[@]}"
            else
              echo "::error::The self-hosted runner needs a host C compiler and unzip; install build-essential and unzip or grant root/sudo package access."
              exit 1
            fi
          fi

          if ! command -v cc >/dev/null 2>&1; then
            compiler="$(command -v gcc || command -v clang)"
            mkdir -p "$RUNNER_TEMP/cc-bin"
            ln -sf "$compiler" "$RUNNER_TEMP/cc-bin/cc"
            echo "$RUNNER_TEMP/cc-bin" >> "$GITHUB_PATH"
            export PATH="$RUNNER_TEMP/cc-bin:$PATH"
          fi

          cc --version
          unzip -v | head -n 1
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          clean: false
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-unknown-unknown
          cache: false
      - name: Verify repository-pinned Rust toolchain
        run: |
          rustc --version
          cargo --version
          rustup target list --installed | grep -Fx wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Ensure pinned build tools in persistent runner cache
        run: bash scripts/ensure-wasm-tools.sh
      - name: Install JavaScript dependencies
        run: yarn install --frozen-lockfile --prefer-offline
      - name: Build browser-only VSIX with selected assets
        run: yarn package:vscode:web
        env:
          TINYMIST_WASM_ASSET_MANIFEST: ${{ inputs.manifest_path }}
          TINYMIST_WASM_ASSET_UPDATE_LOCK: ${{ inputs.update_lock }}
      - name: Upload browser VSIX, asset lock, and notices
        uses: actions/upload-artifact@v4
        with:
          name: tinymist-web-custom-${{ github.run_number }}
          path: |
            dist/tinymist-web-*.vsix
            target/wasm-assets/wasm-assets.lock.json
            target/wasm-assets/THIRD-PARTY-NOTICES.txt
          if-no-files-found: error
          retention-days: 14
