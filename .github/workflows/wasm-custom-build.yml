name: WASM custom browser package

on:
  workflow_dispatch:
    inputs:
      manifest_path:
        description: Repository-relative JSON asset manifest
        required: true
        default: wasm-assets-smoke.json
        type: string
      update_lock:
        description: Download assets and generate/update the lockfile
        required: true
        default: true
        type: boolean

# Manual asset builds are independent from regular CI and replace older
# manual builds on the same ref rather than running concurrently.
concurrency:
  group: tinymist-browser-v2-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Fetch, embed, and package browser-only Tinymist
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-unknown-unknown
          cache: false
      - name: Verify repository-pinned Rust toolchain
        run: |
          rustc --version
          cargo --version
          rustup target list --installed | grep -Fx wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install pinned Yarn without global runner changes
        run: |
          npm install --prefix "$RUNNER_TEMP/yarn" yarn@1.22.22
          export PATH="$RUNNER_TEMP/yarn/node_modules/.bin:$PATH"
          echo "$RUNNER_TEMP/yarn/node_modules/.bin" >> "$GITHUB_PATH"
          node --version
          npm --version
          yarn --version
      - name: Install wasm-pack if needed
        run: |
          if ! command -v wasm-pack >/dev/null 2>&1; then
            cargo install wasm-pack --locked
          fi
          wasm-pack --version
      - name: Install JavaScript dependencies
        run: yarn install --frozen-lockfile
      - name: Build browser-only VSIX with selected assets
        run: yarn package:vscode:web
        env:
          TINYMIST_WASM_ASSET_MANIFEST: ${{ inputs.manifest_path }}
          TINYMIST_WASM_ASSET_UPDATE_LOCK: ${{ inputs.update_lock }}
      - name: Upload browser VSIX, asset lock, and notices
        uses: actions/upload-artifact@v4
        with:
          name: tinymist-web-custom-${{ github.run_number }}
          path: |
            dist/tinymist-web-*.vsix
            target/wasm-assets/wasm-assets.lock.json
            target/wasm-assets/THIRD-PARTY-NOTICES.txt
          if-no-files-found: error
          retention-days: 14
