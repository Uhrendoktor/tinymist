name: One-time WASM package source validation and docs regeneration

on:
  push:
    branches: [wasm/auto-package-license-lock]
    paths:
      - .github/workflows/one-time-package-source-validation.yml
      - scripts/wasm-assets-manifest.mjs
      - scripts/wasm-assets-manifest.test.mjs
      - scripts/wasm-package-license.mjs
      - scripts/wasm-package-license.test.mjs
      - scripts/wasm-package-source.mjs
      - scripts/wasm-package-source.test.mjs
      - scripts/bundle-wasm-assets.mjs
      - wasm-assets.toml
      - docs/tinymist/introduction.typ

permissions:
  contents: write

jobs:
  validate-lock-and-docs:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wasm/auto-package-license-lock
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: typst-community/setup-typst@v4
      - name: Ensure pinned local build tools
        run: bash scripts/ensure-wasm-tools.sh
      - name: Install JavaScript dependencies
        run: yarn install --frozen-lockfile --prefer-offline
      - name: Test package manifest, license and source helpers
        run: yarn test:wasm-assets
      - name: Resolve assets and regenerate schema-v3 lock
        run: node scripts/bundle-wasm-assets.mjs --update-lock
      - name: Verify the generated lock in locked mode
        run: node scripts/bundle-wasm-assets.mjs --locked
      - name: Build the documentation renderer
        run: yarn build:typlite
      - name: Regenerate README from its Typst source
        run: node scripts/link-docs.mjs
      - name: Commit the generated README and asset lock
        run: |
          git add README.md wasm-assets.lock.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "docs: document Typst package sources and versions"
            git push origin HEAD:wasm/auto-package-license-lock
          fi
