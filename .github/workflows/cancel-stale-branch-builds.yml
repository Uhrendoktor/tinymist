name: Cancel stale branch builds

on:
  push:
    branches:
      - wasm/**
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - nightly
      - stable/**

permissions:
  actions: write
  contents: read

# Push and PR events for the same source branch share one cleanup run.
concurrency:
  group: tinymist-cancel-stale-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  cancel-stale:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel older runs for this branch
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.payload.pull_request?.head.ref ?? context.ref.split("/").slice(2).join("/");
            const headSha = context.payload.pull_request?.head.sha ?? context.sha;
            if (!branch || !headSha) {
              core.setFailed("Could not resolve branch and head SHA for stale-run cleanup.");
              return;
            }

            const runsById = new Map();
            for (const status of ["in_progress", "queued", "waiting", "pending"]) {
              const runs = await github.paginate(
                github.rest.actions.listWorkflowRunsForRepo,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  branch,
                  status,
                  per_page: 100,
                },
              );

              for (const run of runs) {
                if (
                  run.id !== context.runId &&
                  run.head_branch === branch &&
                  run.head_sha !== headSha
                ) {
                  runsById.set(run.id, run);
                }
              }
            }

            for (const run of runsById.values()) {
              core.info("Cancelling stale run " + run.id + " (" + run.name + ") at " + run.head_sha);
              try {
                await github.rest.actions.cancelWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: run.id,
                });
              } catch (error) {
                core.warning("Could not cancel run " + run.id + ": " + error.message);
              }
            }

            core.info("Requested cancellation for " + runsById.size + " stale run(s).");
