name: One-time fork README refresh and branch cleanup

on:
  push:
    branches: [main]
    paths:
      - docs/tinymist/introduction.typ
      - .github/workflows/one-time-fork-maintenance.yml

permissions:
  contents: write

jobs:
  refresh-and-cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
      - name: Install JavaScript dependencies
        run: yarn install --frozen-lockfile
      - name: Build the documentation renderer
        run: yarn build:typlite
      - name: Regenerate generated documentation
        run: node scripts/link-docs.mjs
      - name: Commit the generated README
        run: |
          git add README.md
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "docs: regenerate README with fork ownership"
            git push origin HEAD:main
          fi
      - name: Delete merged feature branches
        run: |
          git push origin --delete \
            wasm/full-browser-tinymist \
            wasm/cargo-assets-manifest
          if git ls-remote --exit-code --heads origin \
            refs/heads/wasm/full-browser-tinymist \
            refs/heads/wasm/cargo-assets-manifest; then
            echo "An obsolete WASM feature branch still exists." >&2
            exit 1
          fi
